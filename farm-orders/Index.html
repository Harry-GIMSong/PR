<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --bg:#f4f6f3; --card:#fff; --ink:#1d2a1f; --sub:#5d6b60; --line:#dfe5dd;
  --brand:#2f7d32; --brand-ink:#fff; --soft:#e8f3e8; --warn:#b3261e; --chip:#eef1ec;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121613; --card:#1c221d; --ink:#e6ece6; --sub:#9aa79c; --line:#2e372f;
    --brand:#66bb6a; --brand-ink:#0d1a0e; --soft:#22331f; --warn:#ff8a80; --chip:#263027;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* 로그인 */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
#login h1{font-size:1.5rem;margin:0 0 6px}
#login p{color:var(--sub);margin:0 0 20px;text-align:center}
.dots{display:flex;gap:12px;margin:8px 0 18px;min-height:22px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--brand);display:block}
.dots i.on{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:12px}
.pad button{height:72px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:1.7rem;font-weight:600}
.pad button:active{background:var(--soft)}
.pad .fn{font-size:1rem;color:var(--sub)}
.remember{margin:18px 0 6px;display:flex;align-items:center;gap:8px;color:var(--sub)}
.remember input{width:22px;height:22px}
.err{color:var(--warn);min-height:1.5em;text-align:center;margin-top:8px;font-weight:600}

/* 상단 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:.85rem;color:var(--sub)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:.95rem}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.95rem}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.filters{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.filters button{border:none;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.88rem}
.filters button.on{background:var(--soft);color:var(--brand);font-weight:700;outline:2px solid var(--brand)}

main{padding:12px 16px 120px;max-width:760px;margin:0 auto}
.count{color:var(--sub);font-size:.9rem;margin:2px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.done{opacity:.62}
.card h3{margin:0 0 8px;font-size:1.05rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .rn{font-size:.75rem;color:var(--sub);font-weight:400;margin-left:auto}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chk{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:600;font-size:.98rem}
.chk.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
dl{margin:0;display:grid;grid-template-columns:minmax(72px,30%) 1fr;gap:6px 10px}
dt{color:var(--sub);font-size:.88rem;padding-top:2px;word-break:keep-all}
dd{margin:0;word-break:break-all;min-height:1.4em}
dd.edit{border-bottom:1px dashed var(--line);cursor:pointer}
dd .empty{color:var(--line)}
.reveal{border:none;background:var(--chip);border-radius:8px;padding:1px 8px;font-size:.8rem;margin-left:6px;vertical-align:1px}
.shown{background:#fff3c4;color:#3b2f00;border-radius:6px;padding:0 4px}
.shown a{color:inherit}
.more{display:block;width:100%;padding:14px;border:1px dashed var(--line);border-radius:14px;background:none;color:var(--sub)}
.empty-state{text-align:center;color:var(--sub);padding:40px 0}

.fab{position:fixed;right:16px;bottom:20px;z-index:6;border:none;background:var(--brand);color:var(--brand-ink);
  border-radius:999px;padding:16px 22px;font-size:1.05rem;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 24px}
.sheet h2{margin:0 0 12px;font-size:1.15rem}
.sheet label{display:block;font-size:.9rem;color:var(--sub);margin:10px 0 4px}
.sheet textarea,.sheet input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.sheet textarea{min-height:90px}
.row-btns{display:flex;gap:10px;margin-top:16px}
.row-btns button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600}
.row-btns .primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;z-index:20;font-size:.95rem;max-width:90vw;text-align:center}
.busy{position:fixed;top:0;left:0;height:3px;background:var(--brand);z-index:30;animation:b 1s infinite linear;width:40%}
@keyframes b{from{left:-40%}to{left:100%}}
</style>
</head>
<body>

<div id="busy" class="busy hidden"></div>

<!-- 로그인 -->
<section id="login">
  <h1>🌱 <?= appTitle ?></h1>
  <p>PIN 번호를 눌러 주세요</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <label class="remember"><input type="checkbox" id="remember"> 이 휴대폰에서 로그인 유지</label>
  <div class="err" id="loginErr"></div>
</section>

<!-- 앱 -->
<section id="app" class="hidden">
  <header>
    <div class="top">
      <h1>🌱 <?= appTitle ?></h1>
      <span class="who" id="who"></span>
      <button class="iconbtn" id="refresh" title="새로고침">↻</button>
      <button class="iconbtn" id="lockBtn" title="잠그기">🔒</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="tools"><input id="q" type="search" placeholder="검색 (상품, 전화 끝 4자리 등)" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
  </header>
  <main>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </main>
  <button class="fab hidden" id="addBtn">＋ 새 주문</button>
</section>

<div id="modal"></div>

<script>
(function(){
  'use strict';
  var KEY = 'farmOrders.token';
  var state = { token:null, data:null, sheet:null, filter:'all', q:'', shown:20, revealed:{} };
  var $ = function(id){ return document.getElementById(id); };

  function store(k, v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  var pending = 0;
  function call(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    pending++; $('busy').classList.remove('hidden');
    return new Promise(function(res, rej){
      var r = google.script.run
        .withSuccessHandler(function(v){ done(); res(v); })
        .withFailureHandler(function(e){ done(); rej(e); });
      r[fn].apply(r, args);
    });
    function done(){ if(--pending<=0){ pending=0; $('busy').classList.add('hidden'); } }
  }
  function msgOf(e){ return String((e && e.message) || e).replace(/^(Error|Exception):\s*/,''); }
  function toast(t){
    var d = document.createElement('div'); d.className='toast'; d.textContent=t;
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600);
  }
  function handleErr(e){
    var m = msgOf(e);
    if (/^AUTH:/.test(m)) { toLogin(m.replace(/^AUTH:\s*/,'')); return; }
    if (/^CONFLICT:/.test(m)) { toast(m.replace(/^CONFLICT:\s*/,'')); refresh(); return; }
    toast(m.replace(/^[A-Z]+:\s*/,''));
  }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  /* ---------- 로그인 ---------- */
  var pin = '';
  function drawDots(){
    var d=$('dots'); d.innerHTML='';
    for (var i=0;i<Math.max(6,pin.length);i++){ var x=el('i', i<pin.length?'on':''); d.appendChild(x); }
  }
  function buildPad(){
    var keys=['1','2','3','4','5','6','7','8','9','지우기','0','확인'];
    keys.forEach(function(k){
      var b=el('button', k.length>1?'fn':'', k);
      b.type='button';
      b.onclick=function(){
        $('loginErr').textContent='';
        if (k==='지우기') pin=pin.slice(0,-1);
        else if (k==='확인') submit();
        else if (pin.length<12) pin+=k;
        drawDots();
      };
      $('pad').appendChild(b);
    });
    document.addEventListener('keydown', function(e){
      if ($('login').classList.contains('hidden')) return;
      if (/^\d$/.test(e.key) && pin.length<12) pin+=e.key;
      else if (e.key==='Backspace') pin=pin.slice(0,-1);
      else if (e.key==='Enter') submit();
      drawDots();
    });
  }
  function submit(){
    if (pin.length<4) { $('loginErr').textContent='PIN 을 끝까지 눌러 주세요.'; return; }
    var p=pin; pin=''; drawDots();
    var remember=$('remember').checked;
    call('login', p, remember).then(function(r){
      state.token=r.token;
      if (remember) store(KEY, r.token); else store(KEY, null);
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      refresh();
    }).catch(function(e){ $('loginErr').textContent=msgOf(e).replace(/^[A-Z]+:\s*/,''); });
  }
  function toLogin(msg){
    state.token=null; state.data=null; state.revealed={}; store(KEY,null);
    $('list').innerHTML=''; $('modal').innerHTML='';
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginErr').textContent=msg||'';
  }

  /* ---------- 데이터 ---------- */
  function refresh(){
    if (!state.token) return;
    return call('getData', state.token, state.sheet).then(function(d){
      state.data=d; state.sheet=d.sheet; state.revealed={};
      render();
    }).catch(handleErr);
  }

  function checkCols(){ return state.data.cols.filter(function(c){ return c.check && !c.empty; }); }
  function isDone(row){
    var cc=checkCols(); if(!cc.length) return false;
    return row.v[cc[cc.length-1].i]===true; // 마지막 체크 열(보통 "발송완료")이 체크되면 완료로 봄
  }

  function render(){
    var d=state.data;
    $('who').textContent=d.user.name+' · '+d.user.roleName;
    // 시트 탭
    var tabs=$('tabs'); tabs.innerHTML='';
    if (d.sheets.length>1) d.sheets.forEach(function(n){
      var b=el('button', n===d.sheet?'on':'', n);
      b.onclick=function(){ state.sheet=n; state.shown=20; state.filter='all'; refresh(); };
      tabs.appendChild(b);
    });
    tabs.classList.toggle('hidden', d.sheets.length<=1);
    // 필터
    var f=$('filters'); f.innerHTML='';
    var cc=checkCols();
    var opts=[['all','전체']];
    if (cc.length){ opts.push(['todo', '안 끝난 것']); opts.push(['done', '끝난 것']); }
    cc.forEach(function(c){ opts.push(['not:'+c.i, c.name+' 안 한 것']); });
    if (opts.length>1) opts.forEach(function(o){
      var b=el('button', state.filter===o[0]?'on':'', o[1]);
      b.onclick=function(){ state.filter=o[0]; state.shown=20; render(); };
      f.appendChild(b);
    });
    $('addBtn').classList.toggle('hidden', d.user.role==='viewer');
    drawList();
  }

  function matches(row){
    var f=state.filter;
    if (f==='todo' && isDone(row)) return false;
    if (f==='done' && !isDone(row)) return false;
    if (f.indexOf('not:')===0 && row.v[Number(f.slice(4))]===true) return false;
    if (state.q){
      var q=state.q.toLowerCase().replace(/\s/g,'');
      var hay=row.v.map(function(x){ return typeof x==='boolean'?'':String(x); }).join(' ').toLowerCase().replace(/\s/g,'');
      if (hay.indexOf(q)<0) return false;
    }
    return true;
  }

  function titleCols(){
    var c=state.data.cols, out=[];
    var dc=c.filter(function(x){ return x.date && !x.pii && !x.check && !x.empty; })[0];
    if (dc) out.push(dc.i);
    c.forEach(function(x){
      if (out.length<3 && !x.pii && !x.check && !x.empty && !x.date) out.push(x.i);
    });
    return out;
  }

  function drawList(){
    var d=state.data, list=$('list'); list.innerHTML='';
    var rows=d.rows.filter(matches);
    $('count').textContent=rows.length+'건'+(d.truncated?' (최근 '+d.rows.length+'행만 불러옴)':'');
    if (!rows.length){ list.appendChild(el('div','empty-state', d.rows.length?'조건에 맞는 주문이 없어요':'아직 주문이 없어요')); return; }
    var tc=titleCols(), canEdit=d.user.role!=='viewer';
    rows.slice(0, state.shown).forEach(function(row){
      var card=el('div','card'+(isDone(row)?' done':''));
      var h=el('h3');
      tc.forEach(function(i, k){ if(row.v[i]!=='') h.appendChild(el('span','', (k?'· ':'')+row.v[i])); });
      if (!h.childNodes.length) h.appendChild(el('span','','(내용 없음)'));
      h.appendChild(el('span','rn', row.r+'행'));
      card.appendChild(h);

      var cc=checkCols();
      if (cc.length){
        var box=el('div','checks');
        cc.forEach(function(c){
          var on=row.v[c.i]===true;
          var b=el('button','chk'+(on?' on':''), (on?'✔ ':'')+c.name);
          b.disabled=!canEdit || c.readonly;
          b.onclick=function(){
            call('updateCell', state.token, d.sheet, row.r, c.i, on, !on).then(function(v){
              row.v[c.i]=v; drawList();
            }).catch(handleErr);
          };
          box.appendChild(b);
        });
        card.appendChild(box);
      }

      var dl=el('dl');
      d.cols.forEach(function(c){
        if (c.check || (c.empty && row.v[c.i]==='')) return;
        var dt=el('dt','',c.name), dd=el('dd');
        var key=row.r+':'+c.i, val=row.v[c.i];
        if (state.revealed[key]!=null){
          var s=el('span','shown'); var real=state.revealed[key];
          if (c.pii==='phone'){ var a=el('a','',real); a.href='tel:'+real.replace(/[^\d+]/g,''); s.appendChild(a); }
          else s.textContent=real;
          dd.appendChild(s);
          var cp=el('button','reveal','복사'); cp.onclick=function(ev){ ev.stopPropagation(); copy(real); };
          dd.appendChild(cp);
        } else {
          if (val==='') dd.appendChild(el('span','empty','—')); else dd.appendChild(document.createTextNode(val));
          if (row.m.indexOf(c.i)>=0){
            var rb=el('button','reveal','보기');
            rb.onclick=function(ev){
              ev.stopPropagation();
              call('reveal', state.token, d.sheet, row.r, c.i).then(function(v){
                state.revealed[key]=v; drawList();
                setTimeout(function(){ if(state.revealed[key]!=null){ delete state.revealed[key]; drawList(); } }, 60000);
              }).catch(handleErr);
            };
            dd.appendChild(rb);
          }
        }
        if (canEdit && !c.readonly){
          dd.className='edit';
          dd.onclick=function(){ editCell(row, c); };
        }
        dl.appendChild(dt); dl.appendChild(dd);
      });
      card.appendChild(dl);
      list.appendChild(card);
    });
    if (rows.length>state.shown){
      var m=el('button','more','더 보기 ('+(rows.length-state.shown)+'건 남음)');
      m.onclick=function(){ state.shown+=30; drawList(); };
      list.appendChild(m);
    }
  }

  function copy(t){
    var ok=function(){ toast('복사했어요'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
    function fallback(){
      var ta=el('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ toast('복사가 안 돼요. 길게 눌러 복사해 주세요.'); }
      ta.remove();
    }
  }

  /* ---------- 고치기 / 추가 ---------- */
  function openModal(title, build, onSave){
    var bg=el('div','sheet-bg'), sh=el('div','sheet');
    sh.appendChild(el('h2','',title));
    build(sh);
    var btns=el('div','row-btns');
    var cancel=el('button','', '취소'), save=el('button','primary','저장');
    cancel.onclick=close; save.onclick=function(){ save.disabled=true; onSave().then(close, function(){ save.disabled=false; }); };
    btns.appendChild(cancel); btns.appendChild(save); sh.appendChild(btns);
    bg.appendChild(sh); bg.onclick=function(e){ if(e.target===bg) close(); };
    $('modal').innerHTML=''; $('modal').appendChild(bg);
    var f=sh.querySelector('textarea,input'); if(f) setTimeout(function(){ f.focus(); }, 50);
    function close(){ $('modal').innerHTML=''; }
  }

  function editCell(row, c){
    var masked=row.m.indexOf(c.i)>=0, key=row.r+':'+c.i;
    if (masked && state.revealed[key]==null){
      // 가려진 칸은 먼저 진짜 값을 불러와서(기록 남음) 그 값을 고치게 함
      call('reveal', state.token, state.data.sheet, row.r, c.i).then(function(v){
        state.revealed[key]=v; drawList(); editCell(row, c);
      }).catch(handleErr);
      return;
    }
    var start=masked ? state.revealed[key] : row.v[c.i];
    var ta;
    openModal(c.name+' 고치기', function(sh){
      ta=el('textarea'); ta.value=start; sh.appendChild(ta);
    }, function(){
      return call('updateCell', state.token, state.data.sheet, row.r, c.i, row.v[c.i], ta.value).then(function(v){
        row.v[c.i]=v; delete state.revealed[key];
        if (v!==ta.value && c.pii){ if(row.m.indexOf(c.i)<0) row.m.push(c.i); }
        drawList(); toast('저장했어요');
      }).catch(function(e){ handleErr(e); throw e; });
    });
  }

  function addNew(){
    var d=state.data, inputs={};
    openModal('새 주문 ('+d.sheet+')', function(sh){
      d.cols.forEach(function(c){
        if (c.empty) return;
        if (c.check){
          var lb=el('label','remember'); var cb=el('input'); cb.type='checkbox';
          lb.appendChild(cb); lb.appendChild(document.createTextNode(' '+c.name)); sh.appendChild(lb);
          inputs[c.i]=cb; return;
        }
        sh.appendChild(el('label','',c.name));
        var inp=el('input'); inp.type='text';
        if (c.date){ var t=new Date(); inp.value=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2); }
        if (c.pii==='phone') inp.inputMode='tel';
        sh.appendChild(inp); inputs[c.i]=inp;
      });
    }, function(){
      var vals={};
      Object.keys(inputs).forEach(function(i){ var x=inputs[i]; vals[i]= x.type==='checkbox' ? x.checked : x.value; });
      return call('addRow', state.token, d.sheet, vals).then(function(){ toast('추가했어요'); return refresh(); })
        .catch(function(e){ handleErr(e); throw e; });
    });
  }

  /* ---------- 시작 ---------- */
  buildPad(); drawDots();
  $('refresh').onclick=refresh;
  $('lockBtn').onclick=function(){ var t=state.token; toLogin('잠갔어요'); if(t) call('logout', t).catch(function(){}); };
  $('addBtn').onclick=addNew;
  var qt; $('q').oninput=function(){ clearTimeout(qt); var v=this.value; qt=setTimeout(function(){ state.q=v.trim(); state.shown=20; drawList(); }, 200); };

  // 화면을 오래 안 보면(30분) 가린 정보 다시 숨기고, 로그인 유지 안 한 경우엔 잠금
  var hiddenAt=0;
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ hiddenAt=Date.now(); state.revealed={}; if(state.data) drawList(); }
    else if (hiddenAt && Date.now()-hiddenAt>30*60000){
      if (!load(KEY) && state.token){ var t=state.token; toLogin('오래 쉬어서 잠갔어요'); call('logout', t).catch(function(){}); }
      else refresh();
    }
  });

  var saved=load(KEY);
  if (saved){
    state.token=saved;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    refresh();
  }
})();
</script>
</body>
</html>
